name: Keep Supabase awake

# Free Supabase projects can pause after 7 days of low activity. Supabase says a
# few requests a day is usually enough, so this queries the DB twice a day.

on:
  schedule:
    - cron: "0 6,18 * * *" # twice a day at 06:00 and 18:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/chat_logs?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded: $code"
          if [ "$code" != "200" ]; then
            echo "Unexpected status $code (expected 200)" >&2
            exit 1
          fi

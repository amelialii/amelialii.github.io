name: Keep Supabase awake

# Free Supabase projects pause after 7 days of "insufficient activity". This
# writes a row to public.heartbeat every 4 hours so the database sees real use.
# One-time setup: run supabase/heartbeat.sql in the Supabase SQL editor.
# SUPABASE_URL must be https://<ref>.supabase.co (not the dashboard link) and
# SUPABASE_KEY the anon key, which can only insert into heartbeat.

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours, at :17 past to avoid the top-of-hour rush
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -u
          SUPABASE_URL="${SUPABASE_URL%/}" # drop a trailing slash if the secret has one

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be the project API URL, https://<ref>.supabase.co" >&2
               echo "(not the supabase.com/dashboard/... link). Fix the repo secret." >&2
               exit 1 ;;
          esac

          # Insert a row into public.heartbeat (expects 201 Created).
          code=$(curl -sS -o /tmp/insert.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/heartbeat" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source":"github-actions"}')
          echo "Heartbeat insert responded: $code"
          if [ "$code" != "201" ]; then
            echo "Insert failed ($code): $(cat /tmp/insert.txt)" >&2
            echo "Check that supabase/heartbeat.sql was run and SUPABASE_KEY is the anon key." >&2
            exit 1
          fi

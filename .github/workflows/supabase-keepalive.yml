name: Keep Supabase awake

# Free Supabase projects pause after 7 days of "insufficient activity". Two tiny
# reads a day weren't enough (Supabase sent a pause warning anyway), so this
# now runs every 4 hours and does a real write plus a read.
# One-time setup: run supabase/heartbeat.sql in the Supabase SQL editor.

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours, at :17 past to avoid the top-of-hour rush
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row and read from the DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -u
          fail=0

          # 1) Write: insert a row into public.heartbeat (expects 201 Created).
          code=$(curl -sS -o /tmp/insert.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/heartbeat" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source":"github-actions"}')
          echo "Heartbeat insert responded: $code"
          if [ "$code" != "201" ]; then
            echo "Insert failed ($code): $(cat /tmp/insert.txt)" >&2
            echo "Did you run supabase/heartbeat.sql in the Supabase SQL editor?" >&2
            fail=1
          fi

          # 2) Read: same query the workflow has always made (expects 200).
          code=$(curl -sS -o /tmp/read.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/chat_logs?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "chat_logs read responded: $code"
          if [ "$code" != "200" ]; then
            echo "Read failed ($code): $(cat /tmp/read.txt)" >&2
            fail=1
          fi

          exit $fail
